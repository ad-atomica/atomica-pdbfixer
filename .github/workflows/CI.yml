name: PDBFixer Continuous Integration Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_test:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Set up Python environment
        run: mise run setup
      - name: Check Python formatting
        run: mise run format --check
      - name: Lint Python
        run: mise run lint
      - name: Check formatting, lint, and types
        run: mise run check
      - name: Run tests
        run: mise run test
